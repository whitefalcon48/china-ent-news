name: deploy-site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-site.yml"
      - "src/site/**"
      - "src/testSiteFeed.ts"
      - "scripts/deploy_lolipop.py"
      - "docs/assets/site/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: china-ent-news-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://bingtangnews.0-w-0.net/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check site build
        run: npm run check

      - name: Build production site
        run: npm run build:site
        env:
          SITE_URL: https://bingtangnews.0-w-0.net
          SITE_BASE_PATH: ""
          SITE_OUTPUT_DIR: dist/lolipop-site

      - name: Validate production artifact
        run: python3 scripts/deploy_lolipop.py --source dist/lolipop-site --remote-dir bingtangnews --check

      - name: Build Pages fallback
        run: npm run build:site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          SITE_BASE_PATH: /${{ github.event.repository.name }}
          SITE_OUTPUT_DIR: dist/site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy production site to Lolipop
        run: python3 scripts/deploy_lolipop.py --source dist/lolipop-site --remote-dir bingtangnews
        env:
          LOLIPOP_FTPS_HOST: ${{ secrets.LOLIPOP_FTPS_HOST }}
          LOLIPOP_FTPS_USER: ${{ secrets.LOLIPOP_FTPS_USER }}
          LOLIPOP_FTPS_PASSWORD: ${{ secrets.LOLIPOP_FTPS_PASSWORD }}
