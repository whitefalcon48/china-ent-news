name: review-apply

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: china-ent-news-production
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.comment.author_association == 'OWNER' &&
      (contains(github.event.issue.labels.*.name, 'daily-review') || contains(github.event.issue.labels.*.name, 'manual-news-review'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://bingtangnews.0-w-0.net/
    env:
      REVIEW_GATE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Apply review comment
        id: review
        run: npm run review:apply
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_ISSUE_NUMBER: ${{ github.event.issue.number }}
          REVIEW_COMMENT: ${{ github.event.comment.body }}
          MANUAL_REVIEW: ${{ contains(github.event.issue.labels.*.name, 'manual-news-review') && 'true' || 'false' }}
          SITE_URL: https://bingtangnews.0-w-0.net
          AI_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          LEDGER_AI_MODEL: deepseek-v4-pro
          COMMENT_AI_MODEL: deepseek-v4-pro
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}

      - name: Commit review data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No review data changes."
          else
            git commit -m "Apply news review ${{ steps.review.outputs.date }}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}" || { git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; }
          fi

      - name: Build approved production site
        if: steps.review.outputs.publish == 'true'
        run: npm run build:site
        env:
          SITE_URL: https://bingtangnews.0-w-0.net
          SITE_BASE_PATH: ""
          SITE_OUTPUT_DIR: dist/lolipop-site

      - name: Validate production artifact
        if: steps.review.outputs.publish == 'true'
        run: python3 scripts/deploy_lolipop.py --source dist/lolipop-site --remote-dir bingtangnews --check

      - name: Build Pages fallback
        if: steps.review.outputs.publish == 'true'
        run: npm run build:site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          SITE_BASE_PATH: /${{ github.event.repository.name }}
          SITE_OUTPUT_DIR: dist/site

      - name: Configure GitHub Pages
        if: steps.review.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.review.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Deploy GitHub Pages
        if: steps.review.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy production site to Lolipop
        if: steps.review.outputs.publish == 'true'
        run: python3 scripts/deploy_lolipop.py --source dist/lolipop-site --remote-dir bingtangnews
        env:
          LOLIPOP_FTPS_HOST: ${{ secrets.LOLIPOP_FTPS_HOST }}
          LOLIPOP_FTPS_USER: ${{ secrets.LOLIPOP_FTPS_USER }}
          LOLIPOP_FTPS_PASSWORD: ${{ secrets.LOLIPOP_FTPS_PASSWORD }}

      - name: Generate approved X texts
        if: steps.review.outputs.publish == 'true' && steps.review.outputs.manual != 'true'
        run: npm run post:x
        env:
          SITE_URL: https://bingtangnews.0-w-0.net
          SITE_BASE_PATH: ""
          POST_DATE: ${{ steps.review.outputs.date }}

      - name: Upload X post texts
        if: steps.review.outputs.publish == 'true' && steps.review.outputs.manual != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: x-post-texts-${{ steps.review.outputs.date }}
          path: output/x_posts_*.md
          if-no-files-found: error

      - name: Generate manual X text
        if: steps.review.outputs.publish == 'true' && steps.review.outputs.manual == 'true' && steps.review.outputs.manual_published == 'true'
        run: node --import tsx src/site/manualXPost.ts
        env:
          SITE_URL: https://bingtangnews.0-w-0.net
          MANUAL_COMMENT_ID: ${{ steps.review.outputs.manual_id }}
          MANUAL_PUBLISHED_DATE: ${{ steps.review.outputs.published_date }}

      - name: Reply with manual publication and X text
        if: steps.review.outputs.publish == 'true' && steps.review.outputs.manual == 'true' && steps.review.outputs.manual_published == 'true'
        run: gh issue comment "${{ github.event.issue.number }}" --body-file "output/manual_x_post_${{ steps.review.outputs.manual_id }}.md"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Close completed review issue
        if: steps.review.outputs.completed == 'true'
        run: gh issue close "${{ github.event.issue.number }}" --comment "✅ 承認記事の公開処理とX投稿文面の生成が完了しました。"
        env:
          GH_TOKEN: ${{ github.token }}
