name: generate-news

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Optional archive date to regenerate (YYYY-MM-DD; blank = today in Shanghai)"
        required: false
        default: ""
        type: string
      provider:
        description: "AI provider"
        required: true
        default: "deepseek"
        type: choice
        options:
          - gemini
          - deepseek
      refresh_review:
        description: "Replace the selected date's stored candidates and create a fresh review issue"
        required: false
        default: false
        type: boolean
      write_compare_fixture:
        description: "Persist a fixed model-comparison fixture for this run"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

env:
  REVIEW_GATE: "true"

concurrency:
  group: generate-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-news:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate news Markdown
        run: npm run start
        env:
          AI_PROVIDER: ${{ inputs.provider || 'deepseek' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          LEDGER_AI_MODEL: deepseek-v4-pro
          COMMENT_AI_MODEL: deepseek-v4-pro
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SOURCE_EXPANSION_SKIP_RSSHUB: "true"
          SOURCE_EXPANSION_MAX_TOPICS: "8"
          EVS_REVIEW_RESCUE: "true"
          EVS_REVIEW_RESCUE_THRESHOLD: "6"
          EVS_REVIEW_RESCUE_LIMIT: "3"
          WRITE_COMPARE_FIXTURE: ${{ inputs.write_compare_fixture == true && 'true' || 'false' }}
          RUN_DATE: ${{ inputs.run_date }}

      - name: Upload generated Markdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-news-markdown-${{ inputs.provider || 'deepseek' }}
          path: output/*.md
          if-no-files-found: warn

      - name: Upload selection trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-trace-${{ inputs.provider || 'deepseek' }}
          path: output/selection_trace_*.json
          if-no-files-found: warn

      - name: Upload topic candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topic-candidates-${{ inputs.provider || 'deepseek' }}
          path: output/topic_candidates_*.json
          if-no-files-found: warn

      - name: Persist daily data
        id: persist
        run: npm run persist:data
        env:
          ALLOW_DATA_OVERWRITE: ${{ inputs.refresh_review == true && 'true' || 'false' }}
          RUN_DATE: ${{ inputs.run_date }}
          ARCHIVE_DATE: ${{ inputs.run_date }}

      - name: Create review issue
        if: env.REVIEW_GATE != 'false'
        run: npm run review:issue
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_DATE: ${{ steps.persist.outputs.date }}
          RUN_DATE: ${{ inputs.run_date }}

      - name: Commit daily data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Daily data is already committed."
          else
            git commit -m "Archive news data ${{ steps.persist.outputs.date }}"
            for attempt in 1 2 3; do
              if git push origin HEAD:${GITHUB_REF_NAME}; then
                exit 0
              fi
              if [ "$attempt" = "3" ]; then
                echo "Daily data push failed after ${attempt} attempts."
                exit 1
              fi
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
          fi

      - name: Mark generation failure after archival
        run: npm run check:generation-status
        env:
          GENERATION_STATUS_DATE: ${{ steps.persist.outputs.date }}
          ARCHIVE_DATE: ${{ steps.persist.outputs.date }}
          RUN_DATE: ${{ inputs.run_date }}

      - name: Build static site
        if: env.REVIEW_GATE == 'false'
        run: npm run build:site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          SITE_BASE_PATH: /${{ github.event.repository.name }}

      - name: Configure GitHub Pages
        if: env.REVIEW_GATE == 'false'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: env.REVIEW_GATE == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Deploy GitHub Pages
        if: env.REVIEW_GATE == 'false'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check X daily digest
        if: env.REVIEW_GATE == 'false'
        run: npm run post:x
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          SITE_BASE_PATH: /${{ github.event.repository.name }}
          POST_DATE: ${{ steps.persist.outputs.date }}

      - name: Upload X post texts
        if: env.REVIEW_GATE == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: x-post-texts
          path: output/x_posts_*.md
          if-no-files-found: error

      - name: Post X daily digest
        if: ${{ env.REVIEW_GATE == 'false' && vars.X_POSTING_ENABLED == 'true' }}
        run: npm run post:x
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          SITE_BASE_PATH: /${{ github.event.repository.name }}
          POST_DATE: ${{ steps.persist.outputs.date }}
          X_POST_LIVE: "true"
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
