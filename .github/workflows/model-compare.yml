name: model-compare

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Fixture date (YYYY-MM-DD)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      LLM_CALL_BUDGET: "120"
      COMPARE_DATE: ${{ inputs.date }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Compare models
        run: npm run compare:models -- data/${{ inputs.date }}/compare_fixture_${{ inputs.date }}.json
      - name: Upload blinded outputs
        uses: actions/upload-artifact@v4
        with:
          name: model-compare-outputs
          path: |
            output/model_compare_*_combo-*.md
            output/model_compare_*_combo-*.json
          if-no-files-found: error
      - name: Upload comparison key
        uses: actions/upload-artifact@v4
        with:
          name: model-compare-key
          path: output/model_compare_*_key.json
          if-no-files-found: error
